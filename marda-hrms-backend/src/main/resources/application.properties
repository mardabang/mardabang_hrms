spring.application.name=marda-hrms-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marda_hrms}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

app.jwt.secret=${JWT_SECRET:LocalDevelopmentOnlyJwtKey-ChangeBeforeDeployment-2026}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.employee-documents.path=uploads/employee-documents

app.version=v0.1.0

backup.directory=D:/MardaBangBackups
backup.mysqldump.path=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe
backup.database=marda_hrms
backup.username=${BACKUP_DB_USERNAME:root}
backup.password=${BACKUP_DB_PASSWORD:}
backup.temp-directory=D:/MardaBangBackups/temp

# Attendance GPS policy. Set per-firm overrides when firms have different offices.
app.attendance.location.latitude=${ATTENDANCE_LATITUDE:16.7207732617843}
app.attendance.location.longitude=${ATTENDANCE_LONGITUDE:74.46127683282292}
app.attendance.location.radius-meters=${ATTENDANCE_RADIUS_METERS:200}
app.attendance.location.max-accuracy-meters=${ATTENDANCE_MAX_ACCURACY_METERS:50}
# Example: app.attendance.location.firms[MBIPL].latitude=16.7207732617843
# Also configure longitude and radius-meters for each different office.


# Email (SMTP) — Admin forgot-password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${spring.mail.username}
app.reset-password.base-url=${RESET_PASSWORD_BASE_URL:https://localhost:5173/reset-password}
# Permit profile photos and the existing employee PDF uploads.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
